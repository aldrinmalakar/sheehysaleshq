<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sister Store / Comparable | Sheehy Sales HQ</title>
<link rel="stylesheet" href="./sister-store-ui.css">
<script src="./nav.js" defer></script>
<script src="./programs.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Sister Store / Comparable</h1>
  <p class="sub">Match the inquiry honestly, show the real difference and keep the appointment moving.</p>

  <section class="panel">
    <h2>Customer + vehicle context</h2>
    <div class="grid">
      <label>Customer first name<input data-f="name" autocomplete="off" placeholder="Sarah"></label>
      <label>Vehicle they asked for<input data-f="vehicle" autocomplete="off" placeholder="2026 Rogue SL, Boulder Gray"></label>
      <label>Vehicle you can actually show<input id="availableVeh" autocomplete="off" placeholder="2026 Rogue SL, Gun Metallic"></label>
      <label>Where is that vehicle?<select id="location"><option value="our">Our Manassas lot</option><option value="sister">Sister store / group inventory</option></select></label>
      <label>Difference from inquiry<select id="difference">
        <option value="exact-sister">Exact match, but at a sister store</option>
        <option value="color">Same year / model / trim, different color</option>
        <option value="trim">Same year / model, different trim</option>
        <option value="year">Same model / trim, different year</option>
        <option value="trim-color">Different trim + color</option>
        <option value="year-trim">Different year + trim</option>
        <option value="year-color">Different year + color</option>
        <option value="all">Different year + trim + color</option>
        <option value="brand">Different brand, comparable vehicle</option>
      </select></label>
      <label>Customer response<select id="response">
        <option value="first">New lead / first response</option>
        <option value="pushback">“That is not what I asked for”</option>
        <option value="open">Open to a comparable</option>
        <option value="pending">Manager checking sister-store vehicle</option>
        <option value="failed">Requested sister-store unit could not be secured</option>
      </select></label>
      <label>Primary time<input data-f="daytime" autocomplete="off" placeholder="Today at 5:30"></label>
      <label>Alternate time<input data-f="alttime" autocomplete="off" placeholder="Tomorrow at 11:00"></label>
      <label>Your name<input data-f="agent" autocomplete="off" placeholder="Aldrin"></label>
      <label>Your phone<input data-f="number" autocomplete="off" placeholder="Your direct number"></label>
    </div>
    <div class="tagbar"><span class="tag blue" id="differenceTag"></span><span class="tag" id="locationTag"></span><span class="tag alt" id="responseTag"></span></div>
    <div class="match" id="matchSummary"></div>
  </section>

  <div class="scripts" id="scripts"></div>
</div>
<script src="./sister-store-ui.js"></script>
<script src="./sister-store-prefill.js"></script>
</body>
</html>
