<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Behavior Funnel | Sheehy Sales HQ</title>
<link rel="stylesheet" href="./funnel-ui.css">
<script src="./nav.js" defer></script>
<script src="./funnel-data.js"></script>
<script src="./funnel-lead-data.js"></script>
<script src="./funnel-behavior-variants.js"></script>
<script src="./funnel-lead-ops.js" defer></script>
</head>
<body>
<div class="wrap">
  <h1>Behavior Funnel</h1>

  <section class="panel" id="customerContext">
    <div class="panel-title"><div><div class="kicker">1 · Start here</div><h2>Customer context</h2></div><button class="mini-btn" id="clearCustomer" type="button">Clear customer</button></div>
    <div class="context-grid">
      <label>Customer first name<input data-f="name" autocomplete="off" placeholder="Sarah"></label>
      <label>Vehicle of interest<input data-f="vehicle" autocomplete="off" placeholder="2026 Rogue SV"></label>
      <label>Current / trade vehicle<input data-f="current" autocomplete="off" placeholder="2021 RAV4"></label>
      <label>Customer ZIP code<input data-f="zipcode" id="customerZip" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="22102"></label>
      <label>Primary appointment time<input data-f="daytime" autocomplete="off" placeholder="Today at 5:30"></label>
      <label>Alternate appointment time<input data-f="alttime" autocomplete="off" placeholder="Tomorrow at 11:00"></label>
      <label>Your name<input data-f="agent" autocomplete="off" placeholder="Aldrin"></label>
      <label>Your phone<input data-f="number" autocomplete="off" placeholder="Your direct number"></label>
      <label>Your email<input data-f="email" autocomplete="off" placeholder="you@sheehy.com"></label>
    </div>

    <div class="context-tools">
      <div class="context-box">
        <div class="box-title">How can you reach them?</div>
        <div class="channel-chips" id="channelChips"></div>
        <div class="context-status"><span class="status-pill blue" id="contactMode">Phone + Email</span><span class="status-pill" id="distanceStatus">Add ZIP for distance</span></div>
      </div>
      <div class="context-box" id="leadTimingBox">
        <div class="box-title">Lead timing</div>
        <div class="inline-row"><input type="datetime-local" id="leadAt"><button class="mini-btn" id="leadNow" type="button">Now</button><span class="status-pill" id="leadAge">Not set</span></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title"><div><div class="kicker">2 · Behavior</div><h2>What is happening?</h2></div></div>
    <div class="situation-grid">
      <label>Where are you in the sale?<select id="stageSelect"></select></label>
      <label>What did the customer do or ask?<select id="behavior"></select></label>
    </div>
    <div class="behavior-bar"><span class="status-pill blue" id="behaviorTag">Behavior</span><span class="status-pill" id="contextTag">Context</span></div>
  </section>

  <h2 class="scripts-title">Wordtracks</h2>
  <div class="scripts-grid" id="scripts"></div>

  <section class="panel video-panel" id="videoPanel" style="margin-top:15px">
    <div class="panel-title"><div><div class="kicker">3 · 60 seconds</div><h2>DriveCentric 6PO video</h2></div></div>
    <div class="video-grid">
      <div class="sixpo" id="sixpo"></div>
      <div class="companion" id="videoCompanion"></div>
    </div>
  </section>

  <section class="panel" id="videoFollowupPanel">
    <div class="panel-title"><div><div class="kicker">4 · After send</div><h2>DriveCentric video follow-up</h2></div></div>
    <div id="videoDeliveryControls"></div>
    <div class="notice" id="videoNotice"></div>
    <div class="delivery-actions"><button class="mini-btn primary" id="copyNotice" type="button">Copy follow-up</button><button class="mini-btn" id="logVideo" type="button">Log video sent</button><button class="mini-btn" id="logNotice" type="button">Log follow-up</button></div>
    <details class="attempts" id="attemptDetails"><summary id="attemptSummary">Attempt log</summary><div class="attempt-body"><div class="attempt-grid"><label>Activity<select id="logWhat"><option>Called, connected</option><option>Called, left voicemail</option><option>Called, no answer</option><option>Texted</option><option>Emailed</option><option>Sent video by email</option><option>Sent video by SMS</option><option>Video follow-up by email</option><option>Video follow-up by SMS</option></select></label><label>Result<select id="logResult"><option>No response yet</option><option>Replied</option><option>Appointment set</option><option>Callback scheduled</option><option>Not interested</option><option>Bad contact info</option></select></label><button class="mini-btn primary" id="logAdd" type="button">Log attempt</button></div><div id="leadLog"></div></div></details>
  </section>
</div>
<script src="./funnel-ui.js"></script>
</body>
</html>
